name: Release

# Push a v<version> tag on a commit whose package.json and manifest.json carry that version.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Builds the bundle without write access: npm packages and the mcpb CLI are third-party code.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MCPB_VERSION: 2.1.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Check the tag against package.json and manifest.json
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$(node -p 'require("./manifest.json").version')" = "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build the Claude Desktop bundle
        run: |
          npx -y "@anthropic-ai/mcpb@$MCPB_VERSION" validate manifest.json
          npx -y "@anthropic-ai/mcpb@$MCPB_VERSION" pack . "amaranth10-mcp-v$VERSION.mcpb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: amaranth10-mcp-v${{ env.VERSION }}.mcpb
          if-no-files-found: error
          retention-days: 7

  # Runs no repository code: only the artifact download and the release.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.mcpb --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
